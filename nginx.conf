# nginx.conf — reverse proxy devant WordPress
#
# À monter dans le container proxy (voir docker-compose.yml) :
#   volumes:
#     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
#
# Le service WordPress n'expose aucun port sur l'hôte : seul ce proxy
# publie le port 80. Le nom d'hôte "wordpress" est résolu par le DNS
# interne du réseau Docker.

server_tokens off;

server {
    listen 80;
    server_name _;

    # Taille maximale des fichiers envoyés (médias, thèmes, plugins).
    # À garder cohérent avec upload_max_filesize côté PHP.
    client_max_body_size 64M;

    location / {
        proxy_pass http://wordpress:80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    # Pas de journalisation du bruit courant
    location = /favicon.ico { access_log off; log_not_found off; proxy_pass http://wordpress:80; }
    location = /robots.txt  { access_log off; log_not_found off; proxy_pass http://wordpress:80; }
}
