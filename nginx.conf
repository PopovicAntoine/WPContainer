# nginx.conf — reverse proxy devant WordPress
#
# À monter dans le container proxy (voir docker-compose.yml) :
#   volumes:
#     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
#
# Le service WordPress n'expose aucun port sur l'hôte : seul ce proxy
# publie un port. Le nom d'hôte "wordpress" est résolu par le DNS interne
# de Docker (127.0.0.11).
 
server_tokens off;
 
# Résolveur DNS interne de Docker. Combiné à une variable dans proxy_pass,
# Nginx résout le nom "wordpress" à CHAQUE requête (cache de 10 s) au lieu
# de le résoudre une seule fois au démarrage. Deux conséquences :
#   - Nginx démarre même si WordPress n'est pas encore (ou plus) disponible ;
#   - après un redéploiement, WordPress change d'adresse IP et Nginx la
#     retrouve tout seul, sans redémarrage du proxy.
resolver 127.0.0.11 valid=10s ipv6=off;
 
server {
    listen 80;
    server_name _;
 
    # Taille maximale des fichiers envoyés (médias, thèmes, plugins).
    # À garder cohérent avec upload_max_filesize côté PHP (docker/uploads.ini).
    client_max_body_size 64M;
 
    # Sans partie "chemin" dans la variable, Nginx transmet l'URL de la
    # requête telle quelle à WordPress.
    set $wordpress_upstream http://wordpress:80;
 
    location / {
        proxy_pass $wordpress_upstream;
 
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
 
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }
}
