modules:
  # Sonde du site WordPress.
  # Un code 200 (ou une redirection vers l'installeur) prouve que nginx, Apache/PHP et MariaDB répondent : sans base, WordPress renvoie une erreur 500.
  http_wordpress:
    prober: http
    timeout: 10s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [200, 301, 302]
