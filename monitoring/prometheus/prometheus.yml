global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Les noms (db, proxy, ...) sont ceux des services de docker-compose.yml,
# résolus par le DNS interne de Docker.
scrape_configs:
  # Prometheus se supervise lui-même
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métriques de la VM (CPU, RAM, disque, charge)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Métriques des containers Docker (CPU, RAM, réseau, redémarrages)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Métriques MariaDB (connexions, requêtes, requêtes lentes, InnoDB)
  - job_name: mariadb
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  # Sonde HTTP sur le site, via le proxy nginx : disponibilité, code retour,
  # temps de réponse, et expiration du certificat si le site passe en HTTPS.
  - job_name: blackbox-wordpress
    metrics_path: /probe
    params:
      module: [http_wordpress]
    static_configs:
      - targets:
          - http://proxy/wp-login.php
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
