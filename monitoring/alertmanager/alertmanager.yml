global:
  resolve_timeout: 5m
  # --- Paramètres SMTP : adapter l'hôte et les adresses ---
  # Le mot de passe n'est pas dans ce fichier : il est lu dans /run/secrets/smtp_password,
  # écrit par le pipeline à partir du secret GitHub SMTP_PASSWORD.
  smtp_smarthost: "smtp.exemple.fr:587"
  smtp_from: "supervision@exemple.fr"
  smtp_auth_username: "supervision@exemple.fr"
  smtp_auth_password_file: /run/secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: equipe-exploitation
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Les alertes critiques sont répétées plus souvent
    - matchers:
        - severity="critical"
      receiver: equipe-exploitation
      repeat_interval: 1h

receivers:
  - name: equipe-exploitation
    email_configs:
      - to: "admin@exemple.fr"
        send_resolved: true

# Une alerte critique masque l'alerte "warning" de même nom sur la même cible
inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname, instance]
