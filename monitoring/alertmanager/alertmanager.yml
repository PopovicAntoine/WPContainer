global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "popovic.antoine@gmail.com"
  smtp_auth_username: "popovic.antoine@gmail.com"
  smtp_auth_password_file: /run/secrets/smtp_password
  smtp_require_tls: false

route:
  receiver: admin
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Les alertes critiques sont répétées plus souvent
    - matchers:
        - severity="critical"
      receiver: admin
      repeat_interval: 1h

receivers:
  - name: admin
    email_configs:
      - to: "popovic.antoine@gmail.com"
        send_resolved: true

# Une alerte critique masque l'alerte "warning" de même nom sur la même cible
inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname, instance]
