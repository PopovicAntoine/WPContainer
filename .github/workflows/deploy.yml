name: CI/CD WordPress

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois ; un nouveau push attend la fin du précédent.
concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/wordpress-custom
  DEPLOY_DIR: /opt/wordpress

jobs:
  # ---------------------------------------------------------------
  # 1. Contrôles statiques : échouent avant tout build ou déploiement
  # ---------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Contrôle du Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Validation du fichier Compose
        run: docker compose --env-file .env.example config --quiet

  # ---------------------------------------------------------------
  # 2. Construction de l'image et envoi vers GHCR
  # ---------------------------------------------------------------
  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Génère les tags (latest + SHA du commit) et met le nom en minuscules,
      # ce que GHCR exige.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 3. Déploiement sur la VM de test (runner auto-hébergé)
  # ---------------------------------------------------------------
  deploy-test:
    needs: build
    runs-on: self-hosted
    environment: test
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Connexion à GHCR : nécessaire pour tirer une image privée.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Les fichiers de déploiement vivent dans /opt/wordpress, le même
      # dossier que celui utilisé par backup.sh et restore.sh : le nom de
      # projet Compose (donc des volumes) reste identique d'un déploiement
      # à l'autre. L'utilisateur du runner doit avoir les droits d'écriture.
      - name: Copie des fichiers de déploiement
        run: |
          install -d "$DEPLOY_DIR"
          install -m 644 docker-compose.yml nginx.conf "$DEPLOY_DIR/"
      
      - name: Vérification des secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        run: |
          for v in DB_PASSWORD DB_ROOT_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Le secret $v est vide ou absent de l'environnement test"
              exit 1
            fi
          done

      - name: Écriture du fichier .env à partir des secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        run: |
          umask 077
          {
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}"
            echo "WP_IMAGE=${IMAGE_NAME,,}:latest"
          } > "$DEPLOY_DIR/.env"

      - name: Mise à jour de la stack
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose pull
          docker compose up -d --remove-orphans

      - name: smoke test
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsSL http://localhost | grep -qi wordpress; then
              echo "Le site répond."
              exit 0
            fi
            echo "Tentative $i/12 : le site ne répond pas encore..."
            sleep 5
          done
          echo "Le site ne répond pas après 60 s." >&2
          docker compose ps
          docker compose logs --tail=50
          exit 1

      - name: Nettoyage des anciennes images
        if: success()
        run: docker image prune -f
